<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Landing Page Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #fbbf24;
            --dark: #000000;
            --text: #ffffff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Outfit', sans-serif; background: var(--dark); color: var(--text); line-height: 1.4; }
        .hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&q=80&w=1200'); background-size: cover; background-position: center; }
        .hero-content { text-align: center; max-width: 800px; padding: 2rem; z-index: 10; }
        h1 { font-size: clamp(3rem, 10vw, 6rem); text-transform: uppercase; font-weight: 900; line-height: 0.9; margin-bottom: 2rem; }
        .highlight { color: var(--primary); }
        .btn { padding: 1.5rem 3rem; background: var(--primary); color: black; font-weight: 900; text-transform: uppercase; border: none; cursor: pointer; border-radius: 4px; font-size: 1.2rem; transition: 0.2s; }
        .btn:hover { transform: skewX(-5deg) scale(1.05); }
        .stats { position: absolute; bottom: 0; left: 0; width: 100%; display: flex; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); padding: 2rem; justify-content: space-around; border-top: 2px solid var(--primary); }
        .stat-item h3 { font-size: 2.5rem; color: var(--primary); }
        @media (max-width: 768px) { .stats { flex-direction: column; gap: 2rem; position: static; } }
    </style>
</head>
<body>
    <section class="hero">
        <div class="hero-content">
            <h1>No <span class="highlight">Excuses</span><br>Only <span class="highlight">Results</span></h1>
            <p style="font-size: 1.5rem; margin-bottom: 3rem;">Join the 30-day body transformation challenge. Personal coaching, custom meal plans, and elite community.</p>
            <button class="btn">Start Your Transformation</button>
        </div>
        <div class="stats">
            <div class="stat-item">
                <h3>500+</h3>
                <p>Happy Members</p>
            </div>
            <div class="stat-item">
                <h3>30</h3>
                <p>Days Program</p>
            </div>
            <div class="stat-item">
                <h3>24/7</h3>
                <p>Support</p>
            </div>
        </div>
    </section>
    <script>lucide.createIcons();</script>
</body>
</html>
